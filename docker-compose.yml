version: '3.8'

services:
  # PostgreSQL 数据库（带 pgvector 扩展）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jetwash-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jetwashpostgres
      POSTGRES_DB: jetwash
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama 服务
  ollama:
    image: ollama/ollama:latest
    container_name: jetwash-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # Jetwash Platform 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jetwash
    ports:
      - "13142:13142"
    environment:
      - GIN_MODE=release
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local
