services:
  # PostgreSQL 数据库（带 pgvector 扩展）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jetwash-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jetwash-postgres
      POSTGRES_DB: jetwash
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: jetwash-redis
    environment:
      REDIS_PASSWORD: jetwash-redis
    command: 
      - "redis-server"
      - "--requirepass"
      - "jetwash-redis"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Ollama 服务
  ollama:
    image: ollama/ollama:latest
    container_name: jetwash-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama  
    restart: unless-stopped

  # Jetwash Platform 应用
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: jetwash
  #   ports:
  #     - "13142:13142"
  #   environment:
  #     - GIN_MODE=release
  #   volumes:
  #     - ./config.yaml:/app/config.yaml:ro
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
